<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05060f"/><stop offset="1" stop-color="#0a1430"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4fd8ff" stop-opacity="0.5"/><stop offset="1" stop-color="#4fd8ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="340" fill="url(#sky)"/>
  <circle cx="1050" cy="150" r="220" fill="url(#glow)"/>
  <!-- stars -->
  <g fill="#ffffff" opacity="0.8"><circle cx="120" cy="60" r="1.6"/><circle cx="300" cy="40" r="1.2"/><circle cx="520" cy="80" r="1.4"/><circle cx="760" cy="50" r="1.2"/><circle cx="980" cy="70" r="1.6"/><circle cx="1180" cy="40" r="1.3"/><circle cx="200" cy="280" r="1.3"/><circle cx="640" cy="300" r="1.4"/></g>
  <!-- player ship -->
  <g transform="translate(1040,170) rotate(-20)">
    <polygon points="0,-34 16,22 0,10 -16,22" fill="#eaf4ff" stroke="#4fd8ff" stroke-width="2.5"/>
    <polygon points="0,10 7,30 0,24 -7,30" fill="#ffb14f"/>
  </g>
  <!-- bullets -->
  <g fill="#ff4fd8"><circle cx="980" cy="120" r="4"/><circle cx="930" cy="90" r="4"/><circle cx="890" cy="70" r="4"/></g>
  <text x="64" y="150" fill="#ffffff" font-size="80" font-weight="800" letter-spacing="3">ARKFALL</text>
  <text x="66" y="200" fill="#9fc4e8" font-size="26">A bullet-hell survival flight game — fly, survive the swarm, grow</text>
  <text x="66" y="262" fill="#4fd8ff" font-size="19" font-weight="600" letter-spacing="2">GODOT 4  ·  GDSCRIPT  ·  15 STAGES  ·  8 LANGUAGES</text>
</svg>
